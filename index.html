<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Collage Creator Pro - Dark Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#1a1a2e',
                        panelDark: '#2c2c54',
                        textLight: '#e0e0e0',
                        accent: '#4f46e5',
                        accentGreen: '#4ade80'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden font-sans">

    <!-- Header -->
    <header class="bg-panelDark border-b border-gray-700 h-14 md:h-16 flex items-center justify-between px-4 md:px-6 shadow-md z-30 shrink-0">
        <div class="flex items-center gap-2">
            <div class="bg-accent/20 p-1.5 md:p-2 rounded-lg">
                <i data-lucide="layout" class="text-accentGreen w-4 h-4 md:w-5 md:h-5"></i>
            </div>
            <h1 class="text-lg md:text-xl font-bold text-textLight truncate">Collage <span class="hidden sm:inline">Creator</span> <span class="text-accentGreen">Pro</span></h1>
            
            <nav class="ml-4 hidden md:flex items-center gap-4">
                <a href="converter.html" class="flex items-center gap-1.5 text-xs font-semibold text-gray-400 hover:text-accent transition-colors">
                    <i data-lucide="camera" class="w-3.5 h-3.5"></i> ARW Converter
                </a>
            </nav>
        </div>
        <div class="flex gap-2">
             <button id="resetBtn" class="px-3 py-1.5 text-xs md:text-sm font-medium text-gray-400 hover:text-red-400 transition flex items-center gap-1.5 border border-gray-600 rounded-md hover:border-red-400">
                <i data-lucide="trash-2" class="w-3 h-3 md:w-4 md:h-4"></i> <span class="hidden sm:inline">Reset</span>
            </button>
            <button id="generateBtn" class="bg-accent hover:bg-indigo-600 text-white px-3 md:px-5 py-1.5 md:py-2 rounded-lg font-medium text-xs md:text-sm shadow-[0_4px_12px_rgba(79,70,229,0.3)] transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none" disabled>
                <span>Done</span>
                <i data-lucide="check" class="w-3 h-3 md:w-4 md:h-4"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Wrapper -->
    <div class="flex flex-col md:flex-row flex-1 overflow-hidden relative">
        
        <!-- Preview Area (Top on Mobile, Right on Desktop) -->
        <main id="previewMain" class="order-1 md:order-2 flex-1 bg-bgDark relative flex flex-col items-center justify-center p-2 md:p-4 overflow-hidden h-[38vh] min-h-[200px] md:h-full z-10 border-b md:border-b-0 md:border-l border-gray-700 transition-all duration-300">
            
            <!-- Info Bar / Mobile Toggle Bar -->
            <div class="absolute top-2 left-2 right-2 md:top-4 md:left-auto md:right-auto z-20 flex justify-between md:justify-center items-center pointer-events-none">
                <div id="infoBar" class="bg-panelDark/90 backdrop-blur shadow-lg border border-gray-700 px-3 py-1.5 rounded-full text-[10px] md:text-xs font-medium text-gray-300 hidden flex items-center gap-2 pointer-events-auto">
                    <span id="dimsDisplay">0 x 0 px</span>
                    <span class="w-px h-3 bg-gray-600 mx-1"></span>
                    <span id="modeDisplay" class="text-gray-400">Preview</span>
                </div>
                <!-- Mobile Toggle Preview Button -->
                <button id="toggleMobilePreviewBtn" class="md:hidden bg-panelDark/90 backdrop-blur border border-gray-700 text-gray-300 px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1.5 shadow-md hover:text-white pointer-events-auto ml-auto">
                    <i data-lucide="eye-off" id="togglePreviewIcon" class="w-3.5 h-3.5 text-accentGreen"></i>
                    <span id="togglePreviewText">Hide Preview</span>
                </button>
            </div>

            <!-- Canvas/Image Container -->
            <div class="relative w-full h-full flex flex-col items-center justify-center flex-1 min-h-0">
                
                <!-- Empty State (Drop Zone) -->
                <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center z-10 p-4 md:p-6 text-center border-2 border-dashed border-gray-600/60 hover:border-accentGreen/80 hover:bg-accentGreen/5 rounded-2xl transition-all cursor-pointer group m-2 md:m-4">
                    <input type="file" id="emptyStateFileInput" multiple accept="image/*" class="hidden">
                    <div class="bg-gray-700/40 p-4 md:p-5 rounded-full mb-3 ring-1 ring-gray-600/50 group-hover:scale-110 group-hover:bg-accentGreen/20 group-hover:ring-accentGreen/50 transition-all pointer-events-none">
                        <i data-lucide="upload-cloud" class="w-8 h-8 md:w-12 md:h-12 text-gray-400 group-hover:text-accentGreen transition-colors"></i>
                    </div>
                    <h3 class="text-gray-200 font-semibold text-base md:text-xl group-hover:text-accentGreen transition-colors pointer-events-none">Drop images here or click to browse</h3>
                    <p class="text-gray-400 text-xs md:text-sm mt-1.5 max-w-xs pointer-events-none">Supports JPG, PNG, WEBP and Sony ARW (RAW) files</p>
                    <button class="mt-4 px-4 py-2 bg-accent/80 group-hover:bg-accent text-white text-xs md:text-sm font-medium rounded-lg shadow-md transition-all flex items-center gap-2 pointer-events-none">
                        <i data-lucide="plus" class="w-4 h-4"></i> Add Images
                    </button>
                </div>

                <!-- Canvas Wrapper -->
                <div id="canvasWrapper" class="relative w-full h-full flex items-center justify-center hidden p-1">
                    <canvas id="mainCanvas" class="max-w-full max-h-full w-auto h-auto object-contain block shadow-2xl border-2 border-gray-700/50 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0iIzFhMWEyZSI+PHJlY3Qgd2lkdGg9IjEwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjMmMyYzU0IiAvPjxyZWN0IHg9IjEwIiB5PSIxMCIgd2lkdGg9IjEwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjMmMyYzU0IiAvPjwvc3ZnPg==')]"></canvas>
                </div>
                
                <!-- Final Result Image (Hidden by default) -->
                <div id="resultWrapper" class="hidden w-full h-full flex flex-col items-center p-4 md:p-8 overflow-y-auto">
                    <h2 class="text-xl md:text-2xl font-bold text-white mb-6 animate-in slide-in-from-top-4 duration-500">Generated <span class="text-accentGreen">Collages</span></h2>
                    
                    <!-- Results container - grid of generated collages -->
                    <div id="resultsList" class="w-full grid grid-cols-2 gap-3 md:gap-8 items-start justify-items-center mb-10 max-w-4xl">
                        <!-- JS fills this with multiple img elements -->
                    </div>
                    
                    <!-- Buttons - fixed at bottom of scrollable area or relative -->
                    <div class="shrink-0 flex gap-2 flex-wrap justify-center bg-panelDark p-3 rounded-xl border border-gray-700 shadow-lg animate-in fade-in slide-in-from-bottom-4 duration-300 z-30 sticky bottom-0">
                        <button id="downloadAllBtn" class="bg-accent hover:bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
                            <i data-lucide="download" class="w-4 h-4"></i> Save All
                        </button>
                        <button id="backToEditBtn" class="bg-transparent hover:bg-gray-700 text-gray-300 px-3 py-2 rounded-lg text-sm font-medium border border-gray-600">
                            <i data-lucide="edit-2" class="w-4 h-4"></i> Back to Edit
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Sidebar (Controls) -->
        <aside class="order-2 md:order-1 w-full md:w-96 bg-panelDark md:border-r border-t md:border-t-0 border-gray-700 overflow-y-auto flex-1 md:flex-none flex flex-col shadow-[0_-4px_20px_rgba(0,0,0,0.4)] z-20">
            <!-- Mobile Sticky Banner to Show Preview when Hidden -->
            <div id="mobileShowPreviewBanner" class="hidden md:!hidden bg-bgDark/90 border-b border-gray-700 p-2 text-center sticky top-0 z-30 backdrop-blur-sm">
                <button id="showMobilePreviewBtn" class="w-full bg-accent/20 border border-accent text-accentGreen hover:bg-accent/30 py-1.5 px-3 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="eye" class="w-4 h-4"></i> Show Collage Preview
                </button>
            </div>

            <div class="p-4 md:p-6 space-y-6 md:space-y-8 pb-20 md:pb-6">
                
                <!-- Images Section (Collapsible) -->
                <div>
                     <button id="toggleImagesBtn" class="w-full flex items-center justify-between text-xs md:text-sm font-semibold text-gray-300 mb-3 group">
                        <span class="flex items-center gap-2">
                            <i data-lucide="image" class="w-3 h-3 md:w-4 md:h-4 text-accentGreen"></i> 
                            Images (<span id="imgCountTotal">0</span>)
                        </span>
                        <i data-lucide="chevron-down" id="imagesChevron" class="w-4 h-4 text-gray-500 transition-transform duration-300"></i>
                    </button>

                    <div id="imagesManagementWrapper" class="space-y-4 hidden">
                        <!-- Upload Section -->
                        <div id="dropZone" class="border-2 border-dashed border-gray-600 rounded-xl p-4 md:p-6 text-center transition-all cursor-pointer hover:border-accentGreen hover:bg-gray-700/30 group relative bg-bgDark/30">
                            <input type="file" id="imageUpload" multiple accept="image/*" class="hidden">
                            <div class="flex flex-col items-center justify-center gap-2 pointer-events-none">
                                <div class="w-10 h-10 md:w-12 md:h-12 bg-gray-700 text-gray-400 rounded-full flex items-center justify-center mb-1 group-hover:scale-110 group-hover:text-accentGreen transition-all">
                                    <i data-lucide="plus" class="w-5 h-5 md:w-6 md:h-6"></i>
                                </div>
                                <p class="text-xs md:text-sm font-medium text-gray-300">Add Images</p>
                            </div>
                        </div>

                        <!-- Thumbnails List -->
                        <div id="thumbnailsSection" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-300">
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="text-[10px] md:text-xs font-semibold text-gray-400 uppercase tracking-wider">Queue</h3>
                                <div class="flex items-center gap-2">
                                    <button id="shuffleBtn" class="text-accentGreen hover:text-white transition-colors p-1 rounded hover:bg-gray-700" title="Shuffle">
                                        <i data-lucide="shuffle" class="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                                    </button>
                                    <button id="sortAlphaBtn" class="text-gray-400 hover:text-accentGreen transition-colors p-1 rounded hover:bg-gray-700" title="Sort A-Z">
                                        <i data-lucide="sort-asc" class="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                                    </button>
                                    <button id="sortDateBtn" class="text-gray-400 hover:text-accentGreen transition-colors p-1 rounded hover:bg-gray-700" title="Sort by Date">
                                        <i data-lucide="calendar" class="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="thumbnailsList" class="grid grid-cols-2 sm:grid-cols-3 gap-2 overflow-y-auto max-h-[350px] p-1 custom-scrollbar"></div>
                        </div>
                    </div>
                </div>

                <!-- Settings -->
                <div id="settingsSection" class="space-y-4 md:space-y-6 opacity-50 pointer-events-none transition-opacity duration-300">
                    
                    <!-- Layout Mode -->
                    <div class="bg-bgDark/50 p-3 md:p-4 rounded-xl border border-gray-700">
                        <h3 class="text-xs md:text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">
                            <i data-lucide="grid" class="w-3 h-3 md:w-4 md:h-4 text-accentGreen"></i> Layout
                        </h3>
                        <div class="grid grid-cols-2 gap-2">
                            <label class="cursor-pointer">
                                <input type="radio" name="layout" value="masonry" class="peer hidden" checked>
                                <div class="border border-gray-600 rounded-md p-2 flex items-center gap-2 hover:bg-gray-700 peer-checked:border-accentGreen peer-checked:text-accentGreen peer-checked:bg-accentGreen/10 transition-all">
                                    <i data-lucide="layout-panel-top" class="w-4 h-4 text-accentGreen"></i>
                                    <span class="text-[10px] md:text-xs truncate">Masonry</span>
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="layout" value="grid" class="peer hidden">
                                <div class="border border-gray-600 rounded-md p-2 flex items-center gap-2 hover:bg-gray-700 peer-checked:border-accentGreen peer-checked:text-accentGreen peer-checked:bg-accentGreen/10 transition-all">
                                    <i data-lucide="layout-grid" class="w-4 h-4 text-accentGreen"></i>
                                    <span class="text-[10px] md:text-xs truncate">Grid (Fill)</span>
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="layout" value="square" class="peer hidden">
                                <div class="border border-gray-600 rounded-md p-2 flex items-center gap-2 hover:bg-gray-700 peer-checked:border-accentGreen peer-checked:text-accentGreen peer-checked:bg-accentGreen/10 transition-all">
                                    <i data-lucide="square" class="w-4 h-4 text-accentGreen"></i>
                                    <span class="text-[10px] md:text-xs truncate">Square (Fit)</span>
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="layout" value="row" class="peer hidden">
                                <div class="border border-gray-600 rounded-md p-2 flex items-center gap-2 hover:bg-gray-700 peer-checked:border-accentGreen peer-checked:text-accentGreen peer-checked:bg-accentGreen/10 transition-all">
                                    <i data-lucide="rows-3" class="w-4 h-4 text-accentGreen"></i>
                                    <span class="text-[10px] md:text-xs truncate">Rows</span>
                                </div>
                            </label>
                        </div>
                        
                        <div class="mt-4" id="columnsControl">
                            <div class="flex justify-between text-[10px] md:text-xs mb-1 text-gray-400">
                                <span id="countLabel">Columns</span>
                                <span id="colCountVal" class="font-medium text-white">3</span>
                            </div>
                            <input type="range" id="colCount" min="1" max="8" value="3" class="w-full h-8 md:h-auto">
                        </div>
                    </div>

                    <!-- Styling -->
                    <div class="bg-bgDark/50 p-3 md:p-4 rounded-xl border border-gray-700">
                        <h3 class="text-xs md:text-sm font-semibold text-gray-300 mb-3 flex items-center gap-2">
                            <i data-lucide="palette" class="w-3 h-3 md:w-4 md:h-4 text-accentGreen"></i> Styling
                        </h3>
                        
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <div class="flex justify-between text-[10px] md:text-xs mb-1 text-gray-400">
                                    <span>Gap</span>
                                    <span id="gapVal" class="text-white">10</span>
                                </div>
                                <input type="range" id="gapSize" min="0" max="100" value="10" class="w-full">
                            </div>
                            <div>
                                <div class="flex justify-between text-[10px] md:text-xs mb-1 text-gray-400">
                                    <span>Radius</span>
                                    <span id="radiusVal" class="text-white">15</span>
                                </div>
                                <input type="range" id="radiusSize" min="0" max="100" value="15" class="w-full">
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-[10px] md:text-xs text-gray-400">Background Color</span>
                            </div>
                            <div class="flex gap-3 mb-2 overflow-x-auto pb-1 no-scrollbar">
                                <button class="w-8 h-8 md:w-6 md:h-6 shrink-0 rounded-full border border-gray-600 bg-white shadow-sm" onclick="setBg('#ffffff')"></button>
                                <button class="w-8 h-8 md:w-6 md:h-6 shrink-0 rounded-full border border-gray-600 bg-black shadow-sm" onclick="setBg('#000000')"></button>
                                <button class="w-8 h-8 md:w-6 md:h-6 shrink-0 rounded-full border border-gray-600 bg-[#1a1a2e] shadow-sm" onclick="setBg('#1a1a2e')"></button>
                                <button class="w-8 h-8 md:w-6 md:h-6 shrink-0 rounded-full border border-gray-600 bg-[#fef3c7] shadow-sm" onclick="setBg('#fef3c7')"></button>
                                <button class="w-8 h-8 md:w-6 md:h-6 shrink-0 rounded-full border border-gray-600 bg-[#4ade80] shadow-sm" onclick="setBg('#4ade80')"></button>
                                <div class="relative w-8 h-8 md:w-6 md:h-6 shrink-0 rounded-full border border-gray-600 overflow-hidden flex items-center justify-center bg-gray-700">
                                     <input type="color" id="bgColor" value="#1a1a2e" class="absolute inset-0 w-[150%] h-[150%] -top-[25%] -left-[25%] cursor-pointer p-0 border-0 opacity-0">
                                     <i data-lucide="plus" class="w-3 h-3 text-white pointer-events-none"></i>
                                </div>
                            </div>
                        </div>

                        <div id="gridSettings" class="mt-4 pt-4 border-t border-gray-700 hidden">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-[10px] md:text-xs text-gray-400">Grid Overlay</span>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <div class="flex justify-between text-[10px] md:text-xs mb-1 text-gray-400">
                                        <span>Weight</span>
                                        <span id="gridWeightVal" class="text-white">5</span>
                                    </div>
                                    <input type="range" id="gridWeight" min="0" max="50" value="5" class="w-full">
                                </div>
                                <div>
                                    <div class="flex justify-between text-[10px] md:text-xs mb-1 text-gray-400">
                                        <span>Color</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <div class="relative w-full h-8 bg-gray-700 rounded-md border border-gray-600 overflow-hidden flex items-center justify-center">
                                            <input type="color" id="gridColor" value="#000000" class="absolute inset-0 w-[150%] h-[150%] -top-[25%] -left-[25%] cursor-pointer p-0 border-0 opacity-0">
                                            <div id="gridColorPreview" class="w-4 h-4 rounded-full bg-accent shadow-sm border border-white/20"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Output -->
                    <div class="bg-bgDark/50 p-3 md:p-4 rounded-xl border border-gray-700">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-xs md:text-sm font-semibold text-gray-300 flex items-center gap-2">
                                <i data-lucide="settings-2" class="w-3 h-3 md:w-4 md:h-4 text-accentGreen"></i> Output
                            </h3>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                             <div>
                                <label class="block text-[10px] md:text-xs text-gray-400 mb-1" title="The size of the longer dimension of the collage">Longer Edge (px)</label>
                                <input type="number" id="canvasWidth" value="2000" class="w-full text-xs md:text-sm bg-gray-700 text-white border border-gray-600 rounded-md p-1.5 md:p-2 focus:border-accentGreen focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[10px] md:text-xs text-gray-400 mb-1">Export Format</label>
                                <select id="exportFormat" class="w-full text-xs md:text-sm bg-gray-700 text-white border border-gray-600 rounded-md p-1.5 md:p-2 focus:border-accentGreen focus:outline-none">
                                    <option value="image/jpeg">JPEG</option>
                                    <option value="image/png">PNG</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mt-3">
                             <div>
                                <label class="block text-[10px] md:text-xs text-gray-400 mb-1" title="Split into collages by item count">Max Imgs / Collage</label>
                                <input id="maxImagesPerCollage" type="number" value="0" min="0" class="w-full text-xs md:text-sm bg-gray-700 text-white border border-gray-600 rounded-md p-1.5 md:p-2 focus:border-accentGreen focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[10px] md:text-xs text-gray-400 mb-1" title="Split into fixed number of results">Collage Count</label>
                                <input id="collageCount" type="number" value="0" min="0" class="w-full text-xs md:text-sm bg-gray-700 text-white border border-gray-600 rounded-md p-1.5 md:p-2 focus:border-accentGreen focus:outline-none">
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </aside>

        <!-- Loader overlay -->
        <div id="processingIndicator" class="hidden absolute inset-0 bg-bgDark/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
            <div class="bg-panelDark p-6 rounded-2xl shadow-2xl border border-gray-700 flex flex-col items-center gap-4">
                <div class="loader w-8 h-8 border-4"></div>
                <div class="text-center">
                    <span class="text-sm font-medium text-textLight block">Processing images...</span>
                    <span id="loaderCount" class="text-xs text-gray-400 mt-1"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
