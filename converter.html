<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARW to JPG Converter - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0f172a',
                        panelDark: '#1e293b',
                        accent: '#6366f1',
                        accentGreen: '#10b981'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .drag-over {
            border-color: #6366f1 !important;
            background: rgba(99, 102, 241, 0.1) !important;
            transform: scale(1.01);
        }
        .spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .status-done { color: #10b981; }
        .status-error { color: #ef4444; }
        .status-wait { color: #94a3b8; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-bgDark text-slate-200 min-h-screen font-sans selection:bg-accent/30">

    <div class="max-w-4xl mx-auto px-4 py-12 md:py-20">
        <!-- Header -->
        <header class="text-center mb-12 animate-in fade-in slide-in-from-top-4 duration-700">
            <div class="inline-flex items-center gap-3 bg-accent/10 px-4 py-2 rounded-full border border-accent/20 mb-4">
                <i data-lucide="camera" class="w-5 h-5 text-accent"></i>
                <span class="text-sm font-semibold text-accent uppercase tracking-widest">Sony RAW Processor</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-bold text-white mb-4 tracking-tight">ARW <span class="text-accent text-transparent bg-clip-text bg-gradient-to-r from-accent to-indigo-400 font-extrabold">Instant</span> Converter</h1>
            <p class="text-slate-400 text-lg max-w-xl mx-auto">Fast JPEG preview extraction from ARW files without losing orientation metadata.</p>
        </header>

        <!-- Drop Zone -->
        <div id="drop-zone" class="glass-panel rounded-3xl p-12 text-center cursor-pointer transition-all duration-300 border-2 border-dashed border-slate-700 hover:border-accent group relative overflow-hidden">
            <input type="file" id="file-input" multiple accept=".arw" class="hidden">
            <div class="relative z-10">
                <div class="w-20 h-20 bg-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:scale-110 group-hover:bg-accent/20 transition-all duration-500 shadow-xl border border-slate-700">
                    <i data-lucide="upload-cloud" class="w-10 h-10 text-slate-400 group-hover:text-accent transition-colors"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Drag ARW files here</h2>
                <p class="text-slate-400">or click here to select files from disk</p>
                <div class="mt-8 flex justify-center gap-4">
                    <span class="px-3 py-1 bg-slate-800 rounded-md text-xs font-medium text-slate-400 border border-slate-700">.ARW ONLY</span>
                    <span class="px-3 py-1 bg-slate-800 rounded-md text-xs font-medium text-slate-400 border border-slate-700">EXIF ROTATION</span>
                </div>
            </div>
            <div class="absolute inset-0 bg-gradient-to-b from-accent/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
        </div>

        <!-- Processing View -->
        <div id="processing-view" class="mt-12 space-y-8 hidden animate-in fade-in slide-in-from-bottom-8 duration-700">
            <!-- Progress Card -->
            <div class="glass-panel rounded-3xl p-8 border border-white/5 relative overflow-hidden">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h3 class="text-xl font-bold text-white flex items-center gap-2">
                             Processing files
                             <span id="total-count" class="bg-slate-800 text-xs px-2 py-0.5 rounded text-accent">0</span>
                        </h3>
                    </div>
                    <div class="text-right">
                        <span id="progress-percent" class="text-2xl font-black text-accent">0%</span>
                    </div>
                </div>
                
                <!-- Progress Bar -->
                <div class="h-3 bg-slate-800 rounded-full overflow-hidden border border-slate-700/50">
                    <div id="progress-fill" class="h-full bg-gradient-to-r from-accent to-indigo-500 w-0 transition-all duration-300 shadow-[0_0_15px_rgba(99,102,241,0.5)]"></div>
                </div>

                <div class="mt-8 flex flex-col md:flex-row gap-4 items-center justify-between pt-8 border-t border-slate-700/50">
                    <button id="reset-btn" class="w-full md:w-auto px-6 py-3 text-sm font-bold text-slate-400 hover:text-white flex items-center justify-center gap-2 transition-colors">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i> Reset
                    </button>
                    <button id="download-btn" disabled class="w-full md:w-auto bg-accent hover:bg-indigo-500 disabled:opacity-30 disabled:hover:bg-accent text-white px-8 py-4 rounded-xl font-bold transition-all shadow-lg shadow-accent/20 flex items-center justify-center gap-3">
                        <i data-lucide="download" class="w-5 h-5"></i> Download ZIP Archive
                    </button>
                </div>
            </div>

            <!-- File List -->
            <div class="glass-panel rounded-3xl overflow-hidden border border-white/5">
                <div class="px-8 py-4 bg-slate-800/50 border-b border-slate-700/50 flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">File Queue</span>
                    <i data-lucide="list" class="w-4 h-4 text-slate-500"></i>
                </div>
                <div id="file-list" class="max-h-[400px] overflow-y-auto custom-scrollbar">
                    <!-- File items will be injected here -->
                </div>
            </div>
        </div>

        <footer class="mt-20 text-center text-slate-500 text-sm">
            <p>&copy; 2024 ARW Instant Converter • <a href="index.html" class="text-accent hover:underline">Collage Creator Pro</a></p>
        </footer>
    </div>

    <!-- Styles for file list items -->
    <style>
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background: rgba(255, 255, 255, 0.02); }
        .file-info { display: flex; items-center gap: 1rem; }
        .file-name { font-size: 0.875rem; font-weight: 500; color: #e2e8f0; }
        .file-status { display: flex; items-center gap: 0.5rem; font-size: 0.75rem; font-weight: 600; }
    </style>

    <script type="module" src="js/converter.js"></script>
</body>
</html>
